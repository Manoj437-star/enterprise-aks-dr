apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: ecommerce-config
    patch: |-
      - op: replace
        path: /data/REGION
        value: "East US 2 (Primary Active)"
  - target:
      kind: Deployment
      name: ecommerce-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
